<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Vision Kit</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-primary: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        aside {
            width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 10px;
            z-index: 10;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover {
            background: rgba(139, 92, 246, 0.1);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--accent-primary);
            color: white;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        /* Main Content */
        main {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .bg-blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: -200px;
            right: -200px;
            pointer-events: none;
            z-index: 0;
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            padding: 30px;
            gap: 30px;
            z-index: 1;
            height: 100%;
            overflow: hidden;
        }

        /* Panels */
        .panel-left {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-area:hover,
        .upload-area.drag-over {
            border-color: var(--accent-primary);
            background: rgba(139, 92, 246, 0.05);
        }

        .upload-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--text-secondary);
        }

        .upload-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent-primary);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            margin-top: 10px;
        }

        .btn-secondary:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        /* Right Panel: Preview */
        .panel-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 0;
        }

        .preview-container {
            flex: 1;
            display: flex;
            gap: 20px;
            min-height: 0;
        }

        .image-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .image-header {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: white;
            z-index: 2;
        }

        .image-wrapper {
            flex: 1;
            background: #111;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .empty-state {
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* Utilities */
        .hidden {
            display: none !important;
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            backdrop-filter: blur(4px);
            border-radius: 12px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(139, 92, 246, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent-primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <aside>
        <div class="brand">GPU Vision Kit</div>
        <div class="nav-item active" data-filter="canny">
            <span>•</span> Canny Edge
        </div>
        <div class="nav-item" data-filter="gaussian">
            <span>•</span> Gaussian Blur
        </div>
        <div class="nav-item" data-filter="negative">
            <span>•</span> Negative
        </div>
        <div class="nav-item" data-filter="emboss">
            <span>•</span> Emboss
        </div>
    </aside>

    <main>
        <div class="bg-blob"></div>

        <div class="content-wrapper">
            <!-- Left Panel: Controls -->
            <div class="panel-left">

                <!-- Upload Card -->
                <div class="glass-card">
                    <h2>Input Image</h2>
                    <div id="drop-area" class="upload-area">
                        <div class="upload-icon">📁</div>
                        <div class="upload-text">Drag & drop or click to upload</div>
                        <input type="file" id="file-input" hidden accept="image/*">
                    </div>
                </div>

                <!-- Parameters Card -->
                <div class="glass-card">
                    <h2 id="filter-title">Filter Settings</h2>
                    <div id="controls-container">
                        <!-- Dynamic controls will be injected here -->
                    </div>

                    <button id="process-btn" class="btn btn-primary">
                        <span>✨</span> Process Image
                    </button>
                    <a id="download-link" class="hidden" style="text-decoration: none;">
                        <button class="btn btn-secondary">
                            <span>⬇</span> Download Result
                        </button>
                    </a>
                </div>

            </div>

            <!-- Right Panel: Preview -->
            <div class="panel-right">
                <div class="preview-container">

                    <!-- Original Image -->
                    <div class="image-card glass-card">
                        <div class="image-header">Original</div>
                        <div class="image-wrapper">
                            <img id="original-image" class="hidden" alt="Original">
                            <div id="empty-original" class="empty-state">
                                <span>No image loaded</span>
                            </div>
                        </div>
                    </div>

                    <!-- Processed Image -->
                    <div class="image-card glass-card">
                        <div class="image-header">Processed</div>
                        <div class="image-wrapper">
                            <img id="processed-image" class="hidden" alt="Processed">
                            <div id="empty-processed" class="empty-state">
                                <span>Process an image to see result</span>
                            </div>
                            <div id="loading" class="loading-overlay hidden">
                                <div class="spinner"></div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script>
        // Configuration for all filters
        const filterConfig = {
            canny: {
                name: "Canny Edge Detection",
                controls: [
                    { id: 'kernel', label: 'Kernel Size', type: 'range', min: 3, max: 99, step: 2, value: 5 },
                    { id: 'sigma', label: 'Sigma', type: 'range', min: 1, max: 50, step: 1, value: 2 },
                    { id: 'low', label: 'Low Threshold', type: 'range', min: 0, max: 255, step: 1, value: 0, suffix: '(Auto if 0)' },
                    { id: 'high', label: 'High Threshold', type: 'range', min: 0, max: 255, step: 1, value: 0, suffix: '(Auto if 0)' }
                ]
            },
            gaussian: {
                name: "Gaussian Blur",
                controls: [
                    { id: 'kernel', label: 'Kernel Size', type: 'range', min: 3, max: 99, step: 2, value: 15 },
                    { id: 'sigma', label: 'Sigma', type: 'range', min: 1, max: 25, step: 1, value: 5 }
                ]
            },
            negative: {
                name: "Negative Filter",
                controls: []
            },
            emboss: {
                name: "Emboss Filter",
                controls: [
                    { id: 'kernel_size', label: 'Kernel Size', type: 'range', min: 3, max: 9, step: 2, value: 3 },
                    { id: 'bias_value', label: 'Bias', type: 'range', min: 0, max: 255, step: 1, value: 128 }
                ]
            }
        };

        // Backend endpoints for each filter
        const endpoints = {
            canny: '/api/canny',
            gaussian: '/api/gaussian',
            negative: '/api/negative',
            emboss: '/api/emboss'
        };

        // State
        let currentFilter = 'canny';
        let currentFile = null;
        const controlValues = {};

        // DOM Elements
        const controlsContainer = document.getElementById('controls-container');
        const filterTitle = document.getElementById('filter-title');
        const navItems = document.querySelectorAll('.nav-item');
        const dropArea = document.getElementById('drop-area');
        const fileInput = document.getElementById('file-input');
        const originalImg = document.getElementById('original-image');
        const processedImg = document.getElementById('processed-image');
        const emptyOriginal = document.getElementById('empty-original');
        const emptyProcessed = document.getElementById('empty-processed');
        const loading = document.getElementById('loading');
        const processBtn = document.getElementById('process-btn');
        const downloadLink = document.getElementById('download-link');

        function init() {
            renderControls(currentFilter);
            setupEventListeners();
        }

        function renderControls(filterKey) {
            const config = filterConfig[filterKey];
            filterTitle.textContent = config.name;
            controlsContainer.innerHTML = '';

            config.controls.forEach(ctrl => {
                const val = controlValues[ctrl.id] !== undefined ? controlValues[ctrl.id] : ctrl.value;

                const group = document.createElement('div');
                group.className = 'control-group';
                group.innerHTML = `
                <div class="control-header">
                    <label>${ctrl.label} ${ctrl.suffix || ''}</label>
                    <span id="val-${ctrl.id}">${val}</span>
                </div>
                <input type="${ctrl.type}" id="${ctrl.id}" 
                       min="${ctrl.min}" max="${ctrl.max}" step="${ctrl.step}" value="${val}">
            `;
                controlsContainer.appendChild(group);

                const input = group.querySelector('input');
                input.addEventListener('input', (e) => {
                    document.getElementById(`val-${ctrl.id}`).textContent = e.target.value;
                    controlValues[ctrl.id] = e.target.value;
                });
            });

            if (config.controls.length === 0) {
                const info = document.createElement('div');
                info.className = 'control-group';
                info.innerHTML = `
                <span style="font-size:0.85rem; color:var(--text-secondary);">
                    This filter has no parameters. Just upload an image and click "Process Image".
                </span>
            `;
                controlsContainer.appendChild(info);
            }

            if (filterKey === 'gaussian') {
                const extra = document.createElement('div');
                extra.className = 'control-group';
                extra.innerHTML = `
                <div class="control-header">
                    <label>Gaussian Mode</label>
                </div>
                <label style="display:flex; align-items:center; gap:6px; font-size:0.85rem; color:var(--text-secondary);">
                    <input type="checkbox" id="gauss-auto-mask" />
                    Use recommended Gaussian mask (auto)
                </label>
                <span style="font-size:0.75rem; color:var(--text-secondary);">
                    If enabled, kernel size and sigma are chosen automatically based on the image size.
                </span>
            `;
                controlsContainer.appendChild(extra);

                const autoCheckbox = extra.querySelector('#gauss-auto-mask');
                const sliderInputs = controlsContainer.querySelectorAll('input[type="range"]');
                autoCheckbox.addEventListener('change', (e) => {
                    const disabled = e.target.checked;
                    sliderInputs.forEach(inp => {
                        inp.disabled = disabled;
                        inp.style.opacity = disabled ? 0.5 : 1;
                    });
                });
            }

            if (filterKey === 'canny') {
                const extra = document.createElement('div');
                extra.className = 'control-group';
                extra.innerHTML = `
                <div class="control-header">
                    <label>Canny Mode</label>
                </div>
                <label style="display:flex; align-items:center; gap:6px; font-size:0.85rem; color:var(--text-secondary);">
                    <input type="checkbox" id="canny-auto-mode" />
                    Use recommended Canny settings (auto)
                </label>
                <span style="font-size:0.75rem; color:var(--text-secondary);">
                    If enabled, all parameters are chosen automatically based on the image size.
                </span>
            `;
                controlsContainer.appendChild(extra);

                const autoCheckbox = extra.querySelector('#canny-auto-mode');
                const sliderInputs = controlsContainer.querySelectorAll('input[type="range"]');
                autoCheckbox.addEventListener('change', (e) => {
                    const disabled = e.target.checked;
                    sliderInputs.forEach(inp => {
                        inp.disabled = disabled;
                        inp.style.opacity = disabled ? 0.5 : 1;
                    });
                });
            }

            if (filterKey === 'emboss') {
                const extra = document.createElement('div');
                extra.className = 'control-group';
                extra.innerHTML = `
                <div class="control-header">
                    <label>Emboss Mode</label>
                </div>
                <label style="display:flex; align-items:center; gap:6px; font-size:0.85rem; color:var(--text-secondary);">
                    <input type="checkbox" id="emboss-auto-mode" />
                    Use recommended Emboss settings (auto)
                </label>
                <span style="font-size:0.75rem; color:var(--text-secondary);">
                    If enabled, kernel size is chosen automatically based on image size.
                </span>
            `;
                controlsContainer.appendChild(extra);

                const autoCheckbox = extra.querySelector('#emboss-auto-mode');
                const sliderInputs = controlsContainer.querySelectorAll('input[type="range"]');
                autoCheckbox.addEventListener('change', (e) => {
                    const disabled = e.target.checked;
                    sliderInputs.forEach(inp => {
                        inp.disabled = disabled;
                        inp.style.opacity = disabled ? 0.5 : 1;
                    });
                });
            }
        }

        function setupEventListeners() {
            navItems.forEach(item => {
                item.addEventListener('click', () => {
                    navItems.forEach(n => n.classList.remove('active'));
                    item.classList.add('active');

                    currentFilter = item.dataset.filter;
                    renderControls(currentFilter);
                });
            });

            dropArea.addEventListener('click', () => fileInput.click());

            dropArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropArea.classList.add('drag-over');
            });

            dropArea.addEventListener('dragleave', () => dropArea.classList.remove('drag-over'));

            dropArea.addEventListener('drop', (e) => {
                e.preventDefault();
                dropArea.classList.remove('drag-over');
                if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) handleFile(e.target.files[0]);
            });

            processBtn.addEventListener('click', processImage);
        }

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please upload an image file.');
                return;
            }
            currentFile = file;

            const reader = new FileReader();
            reader.onload = (e) => {
                originalImg.src = e.target.result;
                originalImg.classList.remove('hidden');
                emptyOriginal.classList.add('hidden');

                processedImg.classList.add('hidden');
                emptyProcessed.classList.remove('hidden');
                downloadLink.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        async function processImage() {
            if (!currentFile) {
                alert('Please upload an image first.');
                return;
            }

            const endpoint = endpoints[currentFilter];
            if (!endpoint) {
                alert(`The ${filterConfig[currentFilter].name} backend is not implemented yet.\n\nCurrently, Canny Edge Detection, Gaussian Blur and Negative are implemented.`);
                return;
            }

            loading.classList.remove('hidden');

            const formData = new FormData();
            formData.append('file', currentFile);

            // Verificar si el modo automático está activado para cada filtro
            let useAuto = false;

            if (currentFilter === 'gaussian') {
                const autoMaskEl = document.getElementById('gauss-auto-mask');
                useAuto = autoMaskEl && autoMaskEl.checked;
                formData.append('use_auto', useAuto ? 'true' : 'false');
            }

            if (currentFilter === 'canny') {
                const autoModeEl = document.getElementById('canny-auto-mode');
                useAuto = autoModeEl && autoModeEl.checked;
                formData.append('use_auto', useAuto ? 'true' : 'false');
            }

            if (currentFilter === 'emboss') {
                const autoModeEl = document.getElementById('emboss-auto-mode');
                useAuto = autoModeEl && autoModeEl.checked;
                formData.append('use_auto', useAuto ? 'true' : 'false');
            }

            // Solo agregar parámetros manuales si el modo automático NO está activado
            if (!useAuto) {
                const inputs = controlsContainer.querySelectorAll('input[type="range"]');
                inputs.forEach(input => {
                    let paramName = input.id;
                    if (paramName === 'kernel') paramName = 'kernel_size';
                    if (paramName === 'low') paramName = 'low_threshold';
                    if (paramName === 'high') paramName = 'high_threshold';

                    if ((paramName.includes('threshold') && input.value > 0) || !paramName.includes('threshold')) {
                        formData.append(paramName, input.value);
                    }
                });
            }

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Processing failed');
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);

                processedImg.src = url;
                processedImg.classList.remove('hidden');
                emptyProcessed.classList.add('hidden');

                downloadLink.href = url;
                downloadLink.download = `${currentFilter}_result_${Date.now()}.png`;
                downloadLink.classList.remove('hidden');

            } catch (error) {
                alert('Error: ' + error.message);
                console.error(error);
            } finally {
                loading.classList.add('hidden');
            }
        }

        init();
    </script>

</body>

</html>
